name: Make GTA pack
on:
  workflow_dispatch:
    inputs:
      voice: {description: "voice: auto/edge/gemini/none", default: "auto"}
      offline: {description: "skip AI copy (true/false)", default: "false"}
  schedule:
    - cron: "30 3 * * *"   # every day 09:00 IST
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
      ELEVEN_API_KEY: ${{ secrets.ELEVEN_API_KEY }}
      ELEVEN_VOICE: ${{ secrets.ELEVEN_VOICE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Find project folder (works even if files were uploaded inside a sub-folder)
        run: |
          D=$(dirname "$(find . -name make.py -not -path './.git/*' | head -1)")
          echo "Project folder: $D"; echo "PROJ=$D" >> $GITHUB_ENV
          ls -la "$D"
      - run: pip install Pillow numpy scipy requests edge-tts imageio-ffmpeg
      - name: Make pack
        working-directory: ${{ env.PROJ }}
        run: |
          ARGS="--voice ${{ github.event.inputs.voice || 'auto' }}"
          if [ "${{ github.event.inputs.offline }}" = "true" ] || [ -z "$GEMINI_API_KEY" ]; then ARGS="$ARGS --offline"; fi
          python make.py $ARGS
      - uses: actions/upload-artifact@v4
        with:
          name: gta-pack
          path: ${{ env.PROJ }}/output/
      - name: Save history (so lines never repeat)
        working-directory: ${{ env.PROJ }}
        run: |
          git config user.name "pack-bot"; git config user.email "bot@users.noreply.github.com"
          git add history.json && git commit -m "update history" && git push || true
